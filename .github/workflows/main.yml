name: Account-aware engine build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-engine-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: deadlock-api-ingest
            artifact: deadlock-sync-engine-linux-x64
          - runner: windows-latest
            target: x86_64-pc-windows-gnu
            binary: deadlock-api-ingest.exe
            artifact: deadlock-sync-engine-windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
          rustup target add ${{ matrix.target }}
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: account-engine-${{ matrix.runner }}-${{ matrix.target }}-1.98
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Synthetic tests (no Steam account or game)
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage only the worker and license
        run: |
          mkdir -p artifact
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} artifact/
          cp LICENSE FORK.md artifact/
          sha256sum artifact/${{ matrix.binary }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
